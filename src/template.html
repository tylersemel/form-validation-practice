<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/form" method="post" autocomplete="off" novalidate>
      <div class="title">
        <span>All sections are required.</span>
      </div>
      <div class="form-row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" autocomplete="off" required>
        <span class="error" aria-live="polite"></span>
      </div>
      
      <div class="form-row">
        <label for="country">Country: </label>
        <select name="country" id="country" required>
          <option value="ch">Switzerland</option>
          <option value="fr">France</option>
          <option value="de">Germany</option>
          <option value="nl">The Netherlands</option>
          <option value="us">United States of America</option>
        </select>
        <span class="error" aria-live="polite"></span>
      </div>
      <div class="form-row">
        <label for="postal-code">Postal Code:</label>
        <input required type="text" id="postal-code" name="postal-code">
        <span class="error" aria-live="polite"></span>
      </div>
      <div class="form-row">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <span class="error"></span>
      </div>
      <div class="form-row">
        <label for="pass-confirm">Confirm Password:</label>
        <input type="password" id="pass-confirm" name="pass-confirm">
        <span class="error"></span>
      </div>
      <button type="submit">SUBMIT</button>
    </form>
  </body>
</html>
